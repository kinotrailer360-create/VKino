name: VKino Studio smoke tests

on:
  pull_request:
    paths:
      - 'shorts/studio.py'
      - 'shorts/studio_adapter.py'
      - 'shorts/imgsearch.py'
      - 'shorts/clips.py'
      - 'shorts/studio_media_library.py'
      - 'shorts/studio_media_picker.js'
      - 'tests/test_studio*.py'
      - '.github/workflows/studio-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'shorts/studio.py'
      - 'shorts/studio_adapter.py'
      - 'shorts/imgsearch.py'
      - 'shorts/clips.py'
      - 'tests/test_studio*.py'
      - '.github/workflows/studio-smoke.yml'

permissions:
  contents: read

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Syntax validation
        run: python -m compileall -q shorts tests bot.py
      - name: Browser widget syntax
        run: node --check shorts/studio_media_picker.js
      - name: Studio regression tests
        run: python -m pytest -q tests/test_studio.py tests/test_studio_trailer_candidates.py tests/test_studio_batch_media.py tests/test_studio_media_library.py
